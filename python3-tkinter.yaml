name: tkinter
buildsystem: simple
build-commands:
  - pip3 install --prefix=${FLATPAK_DEST} --no-build-isolation .
sources:
  - type: git
    url: https://github.com/iwalton3/tkinter-standalone
    commit: 8e78e38ef0cceb44a3a0062e1c314a4ff3f981db
modules:
  - name: tcl
    buildsystem: autotools
    config-opts:
      - --disable-zipfs
    subdir: unix
    post-install:
      - chmod 755 /app/lib/libtcl*.so
    cleanup:
      - /bin
      - /lib/pkgconfig
      - /man
    sources:
      - type: archive
        url: https://prdownloads.sourceforge.net/tcl/tcl9.1.0-src.tar.gz
        sha256: 536c45543f64d6eb11832d97ba3494aacff046fbc5040273bd55258d0e448ff1
        x-checker-data:
          type: anitya
          project-id: 4941
          stable-only: true
          url-template: https://prdownloads.sourceforge.net/tcl/tcl$version-src.tar.gz
  - name: tk
    buildsystem: autotools
    config-opts:
      - --disable-zipfs
    subdir: unix
    post-install:
      - chmod 755 /app/lib/libtcl*tk*.so
    cleanup:
      - /bin
      - /lib/pkgconfig
      - /man
    sources:
      - type: archive
        url: https://prdownloads.sourceforge.net/tcl/tk9.1.0-src.tar.gz
        sha256: 772ce7a97c07c2db4c957c93af7ab4dff4bd3037772836b6afbcd0974023b3d6
        x-checker-data:
          type: anitya
          project-id: 11426
          stable-only: true
          url-template: https://prdownloads.sourceforge.net/tcl/tk$version-src.tar.gz
